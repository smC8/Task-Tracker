kind = "web"
previewPath = "/"
title = "To-Do App"
description = "A personal task manager for capturing, organizing, and completing everyday tasks, with browser-based persistence."
version = "1.0.0"
id = "artifacts/todo-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25230

[services.development]
run = "pnpm --filter @workspace/todo-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/todo-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/todo-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25230"
BASE_PATH = "/"
